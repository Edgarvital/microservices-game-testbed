apiVersion: v1
kind: Service
metadata:
  name: battle-service
  namespace: onlinegame
spec:
  type: ClusterIP
  selector:
    app: battle-service
  ports:
    # WebSocket dos clientes (upgrade sobre HTTP/1.1). Nome/appProtocol http
    # ajuda o Istio a rotear e a suportar o upgrade de WebSocket.
    - name: http-ws
      appProtocol: http
      port: 8080
      targetPort: 8080
